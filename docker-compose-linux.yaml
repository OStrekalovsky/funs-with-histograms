version: "3.1"
services:
  prometheus:
    image: prom/prometheus:v2.55.1
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    network_mode: host
  grafana:
    image: grafana/grafana:10.4.12
    ports:
      - "3000:3000"
    volumes:
      - ./grafana_data:/var/lib/grafana
    network_mode: host
